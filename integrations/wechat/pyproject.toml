[project]
name = "muse-pool-wechat"
version = "0.1.0"
description = "WeChat iLink adapter for muse-quota, reusing wechat-muse-bridge"
requires-python = ">=3.10"
dependencies = ["wechat-muse-bridge==0.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
muse-pool-wechat = "muse_pool_wechat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["muse_pool_wechat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
