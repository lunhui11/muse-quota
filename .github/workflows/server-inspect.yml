name: Inspect Muse server over SSH

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muse-server-inspection
  cancel-in-progress: false

jobs:
  inspect:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: server-maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out inspection source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          clean: false
          path: inspection-source

      - name: Inspect existing server over verified SSH
        working-directory: ${{ github.workspace }}/inspection-source
        env:
          MUSE_BASE_URL: ${{ vars.MUSE_BASE_URL || 'http://127.0.0.1:8788' }}
          MUSE_DEPLOY_DIR: ${{ vars.MUSE_DEPLOY_DIR || secrets.DEPLOY_PATH }}
          MUSE_SSH_HOST: ${{ vars.MUSE_SSH_HOST || secrets.SSH_HOST || secrets.HOST }}
          MUSE_SSH_PORT: ${{ vars.MUSE_SSH_PORT || secrets.SSH_PORT || secrets.PORT || '22' }}
          MUSE_SSH_USER: ${{ vars.MUSE_SSH_USER || secrets.SSH_USER || secrets.USERNAME }}
          MUSE_SSH_HOST_FINGERPRINT: ${{ vars.MUSE_SSH_HOST_FINGERPRINT }}
          MUSE_SSH_PRIVATE_KEY: ${{ secrets.MUSE_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
        run: python3 scripts/github_ssh_inspect.py
