<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muse 额度探针</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#18263c;background:#f3f5f9;color-scheme:light}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:42px auto;padding:0 24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}.eyebrow{font-size:12px;letter-spacing:.16em;color:#526783;font-weight:700}h1{font-size:30px;letter-spacing:-.04em;margin:8px 0}h2{font-size:18px;margin:0}p{color:#617087;line-height:1.7;margin:8px 0}.panel,.card{background:white;border:1px solid #dfe5ed;border-radius:16px;padding:24px;box-shadow:0 3px 14px #142b4a04}.panel{margin-bottom:22px}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button{border:1px solid #d3dce8;border-radius:9px;background:#fff;color:#24384e;padding:10px 14px;font:inherit;font-size:14px;cursor:pointer}button.primary{background:#2455cf;color:white;border-color:#2455cf}button:disabled{opacity:.45;cursor:default}button:hover:not(:disabled){filter:brightness(.96)}input,textarea{border:1px solid #cbd5e1;border-radius:8px;padding:11px 12px;font:inherit;width:100%;background:white}input:focus,textarea:focus{outline:2px solid #2455cf55;border-color:#2455cf}label{display:block;font-size:13px;color:#526783;margin:14px 0 6px}textarea{resize:vertical;min-height:88px}dialog{width:min(520px,calc(100% - 32px));max-height:90vh;overflow:auto;border:1px solid #dfe5ed;border-radius:16px;padding:24px;color:#18263c}dialog::backdrop{background:#18263c55}.notes{white-space:pre-wrap;color:#617087;font-size:13px;overflow-wrap:anywhere}.auth{max-width:500px;margin:70px auto}.muted{font-size:13px;color:#768399}.notice{min-height:24px;font-size:14px;margin:12px 0;color:#2455cf}.notice.error{color:#b53030}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px}.card-top{display:flex;justify-content:space-between;align-items:start;gap:8px}.badge{border-radius:30px;background:#eff3f8;font-size:12px;padding:6px 10px;color:#526783}.badge.ok{background:#e8f7ef;color:#25764b}.badge.warn{background:#fff3df;color:#a66a16}.big{font-size:38px;font-weight:650;letter-spacing:-.05em;margin:25px 0 0}.big small{font-size:15px;color:#768399;letter-spacing:0;font-weight:400;margin-left:7px}.bar{height:7px;background:#eef1f7;border-radius:6px;margin:12px 0 22px;overflow:hidden}.fill{height:100%;background:#3562d5}.fill.warn{background:#d99a30}dl{display:grid;grid-template-columns:90px 1fr;gap:11px 10px;font-size:13px;margin:18px 0 22px}dt{color:#78869a}dd{margin:0;overflow-wrap:anywhere}.error-box{background:#fff4f2;border-radius:8px;padding:10px;margin:12px 0;color:#a73b35;font-size:13px}.account-note{font-size:12px;color:#768399;overflow-wrap:anywhere;margin:10px 0 0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.add{margin-top:22px}.hidden{display:none!important}footer{padding:25px 0;color:#768399;font-size:12px;line-height:1.7}.summary{font-size:14px;color:#64748b;margin:10px 0 24px}summary{cursor:pointer;font-size:14px;color:#2455cf}@media(max-width:600px){main{margin:24px auto;padding:0 16px}header{align-items:start;flex-direction:column}.form-grid{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.card,.panel{padding:20px}h1{font-size:26px}}
</style>
</head>
<body><main>
<header><div><div class="eyebrow">MUSE / QUOTA MONITOR</div><h1>Muse 额度探针</h1><p>查看各账号的周额度、重置日期与登录状态。</p></div>
<div id="toolbar" class="tools hidden"><button id="refresh" class="primary">检测全部账号</button><button id="logout">退出面板</button></div></header>
<section id="auth" class="panel auth"><h2>连接本机探针</h2><p>粘贴启动脚本复制的访问密钥。密钥只用于访问这个面板。</p><form id="auth-form"><label for="key">访问密钥</label><input id="key" type="password" required autocomplete="off"><div class="tools" style="margin-top:18px"><button class="primary">连接</button></div></form></section>
<div id="notice" class="notice" role="status" aria-live="polite"></div>
<section id="dashboard" class="hidden"><div id="summary" class="summary"></div><div id="cards" class="grid"></div>
<section class="panel add"><details><summary>添加 Muse 账号</summary><form id="add-form"><div class="form-grid">
<div><label for="label">账号名称</label><input id="label" maxlength="80" placeholder="例如：日常任务" required></div>
<div><label for="proxy">固定代理地址（可选）</label><input id="proxy" placeholder="http://127.0.0.1:7890"></div>
<div><label for="proxy-user">代理用户名环境变量（可选）</label><input id="proxy-user" placeholder="MUSE_A_PROXY_USER"></div>
<div><label for="proxy-pass">代理密码环境变量（可选）</label><input id="proxy-pass" placeholder="MUSE_A_PROXY_PASSWORD"></div></div>
<label for="notes">备注（可选）</label><textarea id="notes" maxlength="1000" placeholder="例如：用于日常任务，已绑定网盘"></textarea>
<p class="muted">不填代理时使用当前网络。需要代理认证时，在服务的 .env 中设置对应环境变量并重启服务。</p>
<button class="primary" style="margin-top:14px">添加账号</button></form></details></section>
<footer>登录时会打开该账号独立的浏览器窗口。登录完成后，回到这里点「保存登录并查询」。<br>面板每 5 秒读取缓存；Muse 的实际检测按上方间隔运行。过期读数仅供参考，无法保证账号不会被封。</footer>
</section>
<dialog id="edit-dialog"><form id="edit-form"><h2>编辑账号</h2><label for="edit-label">账号名称</label><input id="edit-label" maxlength="80" required><label for="edit-notes">备注（可选）</label><textarea id="edit-notes" maxlength="1000"></textarea><p id="edit-error" class="notice error" role="alert"></p><div class="tools"><button id="edit-save" class="primary">保存</button><button id="edit-cancel" type="button">取消</button></div></form></dialog>
</main>
<script>
let key = sessionStorage.getItem('muse-probe-key') || '', polling = false, accounts = [], editingId = null;
const $ = id => document.getElementById(id);
const escapeHTML = value => { const span = document.createElement('span'); span.textContent = String(value ?? ''); return span.innerHTML; };
const when = value => value ? new Date(value).toLocaleString('zh-CN', {timeZone:'Asia/Shanghai',hour12:false}) : '尚无记录';
function notice(text, error=false) { $('notice').textContent=text; $('notice').className='notice'+(error?' error':''); }
async function api(path, method='GET', data) {
  const requestKey=key;
  const response = await fetch('/api/'+path, {method,headers:{Authorization:'Bearer '+requestKey,'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});
  const result=await response.json();
  if(requestKey!==key)throw new Error('连接已更改，请重新操作。');
  if(!response.ok){if(response.status===401)showAuth();throw new Error(result.error || '请求失败');}
  return result;
}
function showAuth(){ $('auth').classList.remove('hidden'); $('dashboard').classList.add('hidden'); $('toolbar').classList.add('hidden'); }
async function update(){
  const data=await api('status'); $('auth').classList.add('hidden'); $('dashboard').classList.remove('hidden'); $('toolbar').classList.remove('hidden');
  $('summary').textContent='共 '+data.accounts.length+' 个账号 · 每 '+data.interval_minutes+' 分钟检测 · 周用量达到 '+data.pause_at_percent+'% 时暂停推荐 · 时间为北京时间';
  accounts=data.accounts;
  $('cards').innerHTML=data.accounts.map(a=>{
    const q=a.quota, percent=q?.weekly_used_pct;
    const state=a.login_open?'登录窗口已打开':a.job==='running'?'正在检测':a.job==='queued'?'等待检测':!a.enabled?'已停用':a.status==='never_checked'?'尚未检测':a.status==='error'?'读取失败':a.stale?'读数已过期':a.eligible_for_new_requests?'可分配新请求':'暂停推荐';
    const warn=percent!==undefined && percent>=data.pause_at_percent;
    return '<article class="card"><div class="card-top"><h2>'+escapeHTML(a.label)+'</h2><span class="badge '+(a.eligible_for_new_requests?'ok':warn?'warn':'')+'">'+state+'</span></div>'+
      (a.notes?'<p class="notes">'+escapeHTML(a.notes)+'</p>':'')+
      '<div class="big">'+(percent===undefined?'—':escapeHTML(percent)+'%')+'<small>周用量'+(q&&a.stale?' · 旧读数':'')+'</small></div>'+
      '<div class="bar"><div class="fill '+(warn?'warn':'')+'" style="width:'+(percent??0)+'%"></div></div>'+
      '<dl><dt>周剩余</dt><dd>'+(q?escapeHTML(q.weekly_remaining_pct)+'%':'未知')+'</dd><dt>重置日期</dt><dd>'+escapeHTML(q?.weekly_reset||'未知')+'</dd><dt>套餐</dt><dd>'+escapeHTML(q?.plan||'未知')+'</dd><dt>额外额度</dt><dd>'+escapeHTML(q?.extra_left||'未读取到')+(q?.extra_used_pct!=null?' · 已用 '+escapeHTML(q.extra_used_pct)+'%':'')+'</dd><dt>额外有效期</dt><dd>'+escapeHTML(q?.extra_expires==='never'?'永不过期':q?.extra_expires||'未读取到')+'</dd><dt>最后成功</dt><dd>'+escapeHTML(when(a.last_success_at))+'</dd><dt>网络出口</dt><dd>'+escapeHTML(a.proxy_server||'当前网络（直连）')+'</dd></dl>'+
      (a.error?'<div class="error-box">'+escapeHTML(a.error.message)+'</div>':'')+
      '<div class="tools">'+(a.login_open?'<button data-action="finish-login" data-id="'+a.id+'" class="primary">保存登录并查询</button>':'<button data-action="login" data-id="'+a.id+'" '+(!data.login_available||!a.enabled||a.job?'disabled':'')+'>打开登录窗口</button><button data-action="probe" data-id="'+a.id+'" '+(!a.enabled||a.job?'disabled':'')+'>查询额度</button>')+
      '<button data-action="edit" data-id="'+a.id+'" '+(a.login_open||a.job?'disabled':'')+'>编辑</button><button data-action="toggle" data-enabled="'+a.enabled+'" data-id="'+a.id+'" '+(a.login_open||a.job?'disabled':'')+'>'+(a.enabled?'停用':'启用')+'</button></div>'+
      '<p class="account-note">账号 ID：'+a.id+'</p></article>';
  }).join('');
}
$('auth-form').addEventListener('submit',async e=>{e.preventDefault();key=$('key').value.trim();try{await update();sessionStorage.setItem('muse-probe-key',key);$('key').value='';notice('已连接。');}catch(err){notice(err.message,true);}});
$('logout').onclick=()=>{sessionStorage.removeItem('muse-probe-key');key='';accounts=[];$('cards').replaceChildren();$('edit-dialog').close();showAuth();notice('已退出。');};
$('refresh').onclick=async()=>{try{const r=await api('probe-all','POST',{});notice('已加入检测队列：'+r.queued+' 个账号。');await update();}catch(err){notice(err.message,true);}};
$('add-form').addEventListener('submit',async e=>{e.preventDefault();try{await api('accounts','POST',{label:$('label').value,notes:$('notes').value,proxy_server:$('proxy').value,proxy_username_env:$('proxy-user').value,proxy_password_env:$('proxy-pass').value});e.target.reset();await update();notice('账号已添加，请先登录。');}catch(err){notice(err.message,true);}});
$('edit-cancel').onclick=()=>$('edit-dialog').close();
$('edit-form').addEventListener('submit',async e=>{
  e.preventDefault();$('edit-save').disabled=true;$('edit-error').textContent='';
  try{await api('accounts/'+editingId,'PATCH',{label:$('edit-label').value,notes:$('edit-notes').value});$('edit-dialog').close();await update();notice('名称和备注已保存。');}
  catch(err){$('edit-error').textContent=err.message;}finally{$('edit-save').disabled=false;}
});
$('cards').addEventListener('click',async e=>{
  const button=e.target.closest('button[data-action]');if(!button)return;
  if(button.dataset.action==='edit'){
    const account=accounts.find(a=>a.id===button.dataset.id);if(!account)return;
    editingId=account.id;$('edit-label').value=account.label;$('edit-notes').value=account.notes||'';$('edit-error').textContent='';$('edit-dialog').showModal();return;
  }
  button.disabled=true;
  try{
    const action=button.dataset.action,base='accounts/'+button.dataset.id;
    if(action==='toggle')await api(base,'PATCH',{enabled:button.dataset.enabled!=='true'});
    else{notice(action==='login'?'正在打开独立浏览器，请稍候。':'请求已提交。');await api(base+'/'+action,'POST',{});}
    await update();notice(action==='login'?'请在独立浏览器中登录，完成后回到这里保存。':'操作已完成。');
  }catch(err){notice(err.message,true);button.disabled=false;}
});
if(key)update().catch(err=>notice(err.message,true));
setInterval(async()=>{if(!key||polling)return;polling=true;try{await update();}catch(err){notice(err.message,true);}finally{polling=false;}},5000);
</script></body></html>
